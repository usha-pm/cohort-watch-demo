<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cohort Watch Prototype</title>
<!--
  SupportLogic · Cohort Watch — clickable concept prototype.
  Self-contained: no network requests, no external libraries.
  ALL DATA IS ILLUSTRATIVE. Visual design approximated from two Console screenshots.
-->
<style>
  :root {
    /* Approximated from screenshots (not the design system) */
    --ink: #1d2433;
    --ink-2: #4a5568;
    --muted: #7a8599;
    --tab-muted: #7d8ca3;
    --line: #e5e9f0;
    --line-2: #d6dce6;
    --page: #f5f8fb;
    --card: #ffffff;
    --pill: #cfe5ee;
    --teal: #1e4b5a;
    --teal-2: #2f6c80;
    --link: #1f6fbf;
    --rose: #e23d6d;
    --salmon: #e8696b;
    --orange: #e9a23b;
    --green: #2f8f5b;
    --warn-bg: #fdf4d3;
    --warn-line: #f0d98c;
    --violet: #6b5bd6;
    --violet-bg: #efedfc;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
    --radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); font-size: 14px; line-height: 1.45; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a, .link { color: var(--link); text-decoration: none; cursor: pointer; }
  a:hover, .link:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; }

  /* Prototype strip */
  .proto-strip {
    position: fixed; top: 0; left: 0; right: 0; z-index: 60; height: 24px;
    background: var(--violet); color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .proto-strip b { font-weight: 600; }

  .app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; padding-top: 24px; }

  /* Sidebar */
  .sidebar {
    background: linear-gradient(180deg, #f1f7fc 0%, #eef1fb 60%, #f3eefb 100%);
    border-right: 1px solid var(--line); display: flex; flex-direction: column; position: relative; min-height: 0;
  }
  .logo { font-size: 24px; letter-spacing: -.3px; padding: 22px 20px 18px; font-weight: 500; }
  .logo b { font-weight: 700; }
  .collapse {
    position: absolute; right: -14px; top: 12px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line-2); background: #fff; display: grid; place-items: center; font-size: 12px; color: var(--ink-2);
  }
  .nav { list-style: none; margin: 0; padding: 0 10px; overflow: auto; flex: 1; }
  .nav button {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 2px 0;
    border: 1px solid transparent; border-radius: 10px; background: transparent; font-size: 16px; text-align: left;
  }
  .nav button:hover { background: rgba(255,255,255,.6); }
  .nav button.active { background: #fff; border-color: var(--line); box-shadow: var(--shadow); }
  .nav svg { width: 20px; height: 20px; flex: none; stroke: var(--ink); fill: none; stroke-width: 1.6; }
  .badge-new { background: var(--rose); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
  .user { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 15px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--teal-2); display: grid; place-items: center; font-size: 12px; color: var(--teal-2); }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 28px; background: #fff; }
  .topbar h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .topbar .icons { display: flex; gap: 14px; color: var(--ink-2); }
  .topbar .icons svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .sync {
    background: var(--warn-bg); border-top: 1px solid var(--warn-line); border-bottom: 1px solid var(--warn-line);
    font-size: 13px; text-align: center; padding: 6px 40px; position: relative; color: var(--ink-2);
  }
  .sync button { position: absolute; right: 12px; top: 3px; border: 0; background: none; font-size: 16px; }
  .scroll { overflow: auto; flex: 1; padding: 20px 28px 80px; }
  .tabs { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .tab { border: 0; background: none; font-size: 22px; font-weight: 600; color: var(--tab-muted); padding: 6px 18px; border-radius: 22px; }
  .tab.active { background: var(--pill); color: var(--ink); }
  .tab .chip-proposed { font-size: 10px; vertical-align: middle; margin-left: 6px; }
  .subtitle { color: var(--muted); margin: 4px 0 16px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 8px; font-size: 12px; border: 1px solid var(--line-2); color: var(--ink-2); background: #fff; white-space: nowrap; }
  .chip-proposed { background: var(--violet-bg); color: var(--violet); border-color: #d9d4fa; font-weight: 600; letter-spacing: .2px; }
  .chip-red { color: var(--rose); border-color: #f2a7bd; }
  .chip-green { color: var(--green); border-color: #a8d8bd; }
  .chip-orange { color: #a96a0c; border-color: #f2cf93; background: #fff8ec; }
  .chip-grey { background: #f2f4f7; }
  .btn { border: 1px solid var(--line-2); background: #fff; border-radius: 8px; padding: 7px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--teal-2); }
  .btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  .btn-primary:hover { background: var(--teal-2); }
  .btn-ghost { border-color: transparent; background: none; color: var(--link); padding: 4px 6px; }
  .icon-btn { border: 0; background: none; padding: 4px; color: var(--ink-2); }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  /* Overview replica */
  .ov-wrap { padding: 20px; }
  .ov-tools { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 16px; }
  .select { border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 12px; background: #fff; font-size: 14px; }
  .ov-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .ov-card { padding: 16px 18px; min-height: 180px; display: flex; flex-direction: column; }
  .ov-card.selected { border: 2.5px solid var(--teal); }
  .ov-card .t { font-size: 17px; font-weight: 600; }
  .ov-card .n { font-size: 40px; font-weight: 800; color: var(--rose); line-height: 1; text-align: right; }
  .ov-card .u { color: var(--rose); text-align: right; font-size: 15px; }
  .ov-card .foot { margin-top: auto; font-size: 14px; color: var(--rose); }
  .ov-card svg { width: 100%; height: 50px; }
  .ov-watch { margin-top: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; justify-content: space-between; border-style: dashed; border-color: #cbc4f6; background: #fbfaff; }

  /* Summary replica */
  .sum { padding: 22px 30px; }
  .sum-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .sum-head h2 { margin: 0; font-size: 22px; }
  .outdated { color: var(--orange); font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
  .sum h4 { margin: 16px 0 6px; font-size: 15px; }
  .sum ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 15px; }
  .sum li { margin: 6px 0; }
  .watch-callout { margin: 18px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--violet-bg); display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }

  /* Cohort Watch */
  .cw { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
  .cw-list { padding: 12px; }
  .cw-list h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 4px 6px 10px; }
  .cw-item { width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 10px; padding: 10px 10px; margin-bottom: 4px; display: block; }
  .cw-item:hover { background: #f4f7fa; }
  .cw-item.active { background: #eef6f9; border-color: #bcdbe6; }
  .cw-item .nm { font-weight: 600; font-size: 14px; }
  .cw-item .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rose); display: inline-block; }
  .dot.quiet { background: var(--line-2); }
  .cw-add { width: 100%; margin-top: 8px; justify-content: center; }

  .cw-head { padding: 18px 20px 14px; }
  .cw-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cw-title h2 { margin: 0; font-size: 20px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
  .cw-tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .status-line { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(47,143,91,.18); }

  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 0 20px 16px; }
  .kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fff; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi .v { font-size: 24px; font-weight: 700; margin-top: 2px; }
  .kpi .d { font-size: 12px; margin-top: 2px; }
  .up-bad { color: var(--rose); } .down-good { color: var(--green); } .flat { color: var(--muted); }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; gap: 10px; flex-wrap: wrap; }
  .section-title h3 { margin: 0; font-size: 16px; }
  .ins-list { display: grid; gap: 12px; }
  .ins { padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s; text-align: left; width: 100%; }
  .ins:hover { border-color: #a9cfdc; box-shadow: var(--shadow); }
  .ins.active { border: 2px solid var(--teal); padding: 13px 15px; }
  .ins .kind { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .ins h4 { margin: 0 0 4px; font-size: 15px; }
  .ins p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
  .ins .mets { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
  .ins .mets b { color: var(--ink); }
  .ins .spark { align-self: center; }
  .ins .spark svg { width: 100%; height: 54px; }
  .ins .spark .cap { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
  .sev-high { color: var(--rose); border-color: #f2a7bd; }
  .sev-med { color: #a96a0c; border-color: #f2cf93; background: #fff8ec; }
  .sev-pos { color: var(--green); border-color: #a8d8bd; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  .trend-card { padding: 14px 16px; margin-top: 4px; }
  .trend-card svg { width: 100%; height: 150px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .tooltip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 5px 8px; border-radius: 6px; z-index: 90; display: none; }

  /* Drawer */
  .scrim { position: fixed; inset: 24px 0 0 0; background: rgba(16, 24, 40, .25); z-index: 40; display: none; }
  .drawer {
    position: fixed; top: 24px; right: 0; bottom: 0; width: min(720px, 100vw); background: #fff; z-index: 50;
    box-shadow: -8px 0 24px rgba(16,24,40,.12); transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .drawer-head { padding: 16px 20px 0; border-bottom: 1px solid var(--line); }
  .drawer-head .row { display: flex; align-items: flex-start; gap: 10px; }
  .drawer-head h3 { margin: 4px 0 6px; font-size: 18px; flex: 1; }
  .dtabs { display: flex; gap: 4px; margin-top: 10px; }
  .dtab { border: 0; background: none; padding: 8px 12px; font-weight: 600; color: var(--tab-muted); border-bottom: 2.5px solid transparent; }
  .dtab.active { color: var(--ink); border-bottom-color: var(--teal); }
  .drawer-body { overflow: auto; flex: 1; padding: 16px 20px; }
  .drawer-foot { border-top: 1px solid var(--line); padding: 12px 20px 16px; background: #fbfcfd; }
  .drawer-foot h5 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .action { border: 1px solid var(--line-2); background: #fff; border-radius: 10px; padding: 10px 12px; text-align: left; display: flex; gap: 10px; align-items: flex-start; }
  .action:hover { border-color: var(--teal-2); box-shadow: var(--shadow); }
  .action svg { width: 20px; height: 20px; stroke: var(--teal); fill: none; stroke-width: 1.7; flex: none; margin-top: 2px; }
  .action .at { font-weight: 600; font-size: 13.5px; }
  .action .ad { font-size: 12px; color: var(--muted); }
  .action .avail { font-size: 11px; color: var(--violet); margin-top: 3px; display: inline-flex; gap: 4px; align-items: center; }
  .action.locked svg { stroke: var(--violet); }
  .fb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 12px; flex-wrap: wrap; }
  .fb button { border: 1px solid var(--line-2); background: #fff; border-radius: 6px; padding: 3px 8px; }
  .fb button.on { background: var(--pill); border-color: var(--teal-2); }

  table.cases { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cases th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.cases td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.cases tr.case-row { cursor: pointer; }
  table.cases tr.case-row:hover td { background: #f7fafc; }
  table.cases tr.detail td { background: #f7fafc; color: var(--ink-2); font-size: 12.5px; }
  .ring { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--green); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--green); }
  .ring.hi { border-color: var(--rose); color: var(--rose); }
  .sla-bad { color: var(--rose); }
  .selbar { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .quote { border-left: 3px solid var(--salmon); padding: 6px 12px; margin: 0 0 14px; background: #fff9f9; border-radius: 0 8px 8px 0; }
  .quote .q { font-size: 14px; }
  .quote .src { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .why li { margin: 6px 0; color: var(--ink-2); }
  .note { font-size: 12px; color: var(--muted); background: #f6f7f9; border-radius: 8px; padding: 8px 10px; margin-top: 12px; }

  /* Modal */
  .modal-wrap { position: fixed; inset: 24px 0 0 0; background: rgba(16,24,40,.35); z-index: 70; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-wrap.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: min(620px, 100%); max-height: calc(100vh - 80px); display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(16,24,40,.2); }
  .modal header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal header h3 { margin: 0; font-size: 17px; }
  .modal .mb { padding: 16px 20px; overflow: auto; }
  .modal footer { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font: inherit; }
  .field textarea { min-height: 220px; font-size: 13px; line-height: 1.5; }
  .cond { display: grid; grid-template-columns: 1.4fr 1fr .8fr; gap: 6px; margin-bottom: 6px; }
  .cond div { border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font-size: 13px; background: #fafbfc; }
  .and { font-size: 11px; color: var(--muted); margin: 2px 0 6px; font-weight: 600; }
  .preview-bars .bar { display: grid; grid-template-columns: 170px 1fr 30px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .preview-bars .track { height: 10px; border-radius: 6px; background: #eef1f5; overflow: hidden; }
  .preview-bars .fill { height: 100%; background: var(--violet); opacity: .75; }
  .upsell-box { background: var(--violet-bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 13.5px; }

  /* Toast */
  .toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 95; display: grid; gap: 8px; }
  .toast { background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
  .toast button { background: none; border: 0; color: #9fd3e6; font-weight: 600; }
  .help { position: fixed; right: 24px; bottom: 22px; background: #1f2430; color: #fff; border-radius: 22px; padding: 9px 16px; font-weight: 600; border: 0; z-index: 30; }

  .alerts-mini { margin-top: 14px; }
  .alerts-mini table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .alerts-mini td, .alerts-mini th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; }

  @media (max-width: 1100px) {
    .ov-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cw { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .scroll { padding: 16px; }
    .ins { grid-template-columns: 1fr; }
    .actions { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>

<div class="proto-strip" role="note"><b>Prototype</b> · Cohort Watch concept (proposal) · All data is illustrative · Not a shipped feature</div>

<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="logo">Support<b>Logic</b></div>
    <button class="collapse" title="Collapse (mocked)" data-mock="Collapse sidebar">&laquo;</button>
    <ul class="nav" id="nav"></ul>
    <div class="user"><span class="avatar">UU</span> Usha</div>
  </aside>

  <main>
    <div class="topbar">
      <h1>Sfdc-Sandbox</h1>
      <div class="icons">
        <button class="icon-btn" data-mock="Global search" title="Search (mocked)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
        <button class="icon-btn" data-mock="Language" title="Language (mocked)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg></button>
      </div>
    </div>
    <div class="sync" id="sync">
      Data last synced <b>14 hours 6 min ago</b> (Oct 25, 2:08 AM), data shown here may be out of date.
      <button aria-label="Dismiss sync banner" onclick="document.getElementById('sync').remove()">&times;</button>
    </div>

    <div class="scroll" id="scroll">
      <div class="tabs" role="tablist">
        <button class="tab" data-tab="overview" role="tab">Overview</button>
        <button class="tab" data-tab="summary" role="tab">Summary</button>
        <button class="tab" data-tab="watch" role="tab">Cohort Watch <span class="chip chip-proposed">PROPOSED</span></button>
        <button class="tab" data-tab="team" role="tab">Team</button>
      </div>
      <div id="view"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Insight evidence" aria-hidden="true"></aside>
<div class="modal-wrap" id="modal" role="dialog" aria-modal="true"><div class="modal" id="modalBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tip"></div>
<button class="help" data-mock="Help">? Help</button>

<script>
/* =========================================================================

function toast(msg, undo) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${msg}</span>` + (undo ? '<button>Undo</button>' : '');
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

function spark(values, w, h, color, dots) {
  const max = Math.max(...values, 1), step = w / (values.length - 1);
  const pts = values.map((v, i) => [i * step, h - 4 - (v / max) * (h - 10)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="${h - 2}" x2="${w}" y2="${h - 2}" stroke="#d6dce6"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    ${dots ? `<circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/>` : ''}
  </svg>`;
}

function delta(cur, pri, goodWhenDown) {
  const d = cur - pri;
  if (d === 0) return `<div class="d flat">No change vs prior ${state.range}d</div>`;
  const bad = goodWhenDown ? d > 0 : d < 0;
  return `<div class="d ${bad ? 'up-bad' : 'down-good'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)} vs prior ${state.range}d</div>`;
}

function scaledPrior(co) {
  /* Illustrative: longer comparison windows soften the change. */
  const f = { 7: 1, 14: 0.5, 30: 0.25 }[state.range];
  const p = {};
  for (const k in co.kpi) p[k] = Math.round(co.kpi[k] - (co.kpi[k] - co.prior[k]) * f);
  return p;
}

function bindChart() {
  const co = cohort(), el = $('#chart');
  if (!el) return;
  const W = 900, H = 150, padL = 34, padB = 22, padT = 8;
  const all = [...co.trendEsc, ...co.trendRisk];
  const max = Math.ceil(Math.max(...all) / 10) * 10 || 10;
  const x = i => padL + i * ((W - padL - 10) / (DAYS.length - 1));
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const line = (vals, c) => `<path d="${vals.map((v, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="2"/>` +
    vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}"/>`).join('');
  const ticks = [0, max / 2, max];
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Escalated and SLA-at-risk cases per day">
    ${ticks.map(t => `<line x1="${padL}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}" stroke="#eef1f5"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#7a8599">${t}</text>`).join('')}
    ${DAYS.map((d, i) => i % 2 === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#7a8599">${d}</text>` : '').join('')}
    ${line(co.trendEsc, '#1e4b5a')}${line(co.trendRisk, '#e23d6d')}
    ${DAYS.map((d, i) => `<rect x="${x(i) - 14}" y="0" width="28" height="${H - padB}" fill="transparent" data-tip="${d}: ${co.trendEsc[i]} escalated · ${co.trendRisk[i]} SLA at risk"/>`).join('')}
  </svg>`;
  const tip = $('#tip');
  el.onmousemove = e => {
    const t = e.target.dataset && e.target.dataset.tip;
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t; tip.style.display = 'block';
    tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 30) + 'px';
  };
  el.onmouseleave = () => { tip.style.display = 'none'; };
}

${ids.map(c => `- ${c} · ${CASES[c].acct} · ${CASES[c].tier} tier · ${CASES[c].sla} · owner ${CASES[c].owner}`).join('\n')}

Why it was flagged
${i.why.map(w => '- ' + w).join('\n')}

Suggested next steps
${i.actions.map(a => '- ' + ACTIONS[a].t).join('\n')}

[Illustrative prototype data]`;
  modal(`<header><h3>Share cohort brief</h3><button class="icon-btn" data-close aria-label="Close">${icon('M6 6l12 12M18 6L6 18')}</button></header>
    <div class="mb">
      <div class="field"><label>Brief (editable)</label><textarea id="briefTxt">${esc(txt)}</textarea></div>
      <div class="field"><label>Send to</label><input value="#eng-escalations (Slack), Tali"></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="weekly"> Send this cohort's brief every Monday <span class="chip chip-proposed">PROPOSED</span></label>
    </div>
    <footer><button class="btn" id="copyBrief">Copy text</button><button class="btn btn-primary" id="sendBrief">Share</button></footer>`);
  $('#copyBrief').onclick = async () => {
    const v = $('#briefTxt').value;
    try { await navigator.clipboard.writeText(v); toast('Brief copied to clipboard.'); }
    catch (e) { $('#briefTxt').select(); document.execCommand('copy'); toast('Brief copied to clipboard.'); }
  };
  $('#sendBrief').onclick = () => { const wk = $('#weekly').checked; closeModal(); toast(`Brief shared (mock)${wk ? ', and a weekly send is scheduled' : ''}.`); };
}

/* ============================ EVENTS ============================ */
document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-go]'); if (go) { state.tab = go.dataset.go; render(); return; }
  const tab = t.closest('.tab'); if (tab) { state.tab = tab.dataset.tab; closeDrawer(); render(); return; }
  const mock = t.closest('[data-mock]'); if (mock) { toast(`${esc(mock.dataset.mock)} is mocked in this prototype.`); return; }
  const cs = t.closest('[data-case]'); if (cs) { e.stopPropagation(); toast(`Case ${cs.dataset.case} would open in Workspace or the CRM (mocked).`); return; }
  const gi = t.closest('[data-go-insight]'); if (gi) { state.tab = 'watch'; state.cohort = 'eng'; render(); openInsight(gi.dataset.goInsight); return; }
  if (t.id === 'watchBtn') {
    if (!state.watched.has('eng')) { state.watched.add('eng'); toast('Now watching “Open escalations with engineering issues”.'); }
    state.tab = 'watch'; state.cohort = 'eng'; render(); return;
  }
  const co = t.closest('[data-cohort]'); if (co) { state.cohort = co.dataset.cohort; closeDrawer(); render(); return; }
  if (t.id === 'unwatch') {
    const c = cohort(), prev = state.cohort;
    state.watched.delete(c.id);
    const next = COHORTS.find(x => state.watched.has(x.id));
    if (!next) { state.watched.add(c.id); toast('Keep at least one cohort watched in this prototype.'); return; }
    state.cohort = next.id; render();
    toast(`Stopped watching “${esc(c.name)}”.`, () => { state.watched.add(c.id); state.cohort = prev; render(); });
    return;
  }
  const ins = t.closest('[data-insight]'); if (ins) { openInsight(ins.dataset.insight); return; }
  if (t.closest('#closeDrawer') || t.id === 'scrim') { closeDrawer(); return; }
  const dt = t.closest('[data-dtab]'); if (dt) { state.dtab = dt.dataset.dtab; renderDrawer(); return; }
  if (t.dataset && t.dataset.sel) {
    const id = t.dataset.sel; t.checked ? state.selected.add(id) : state.selected.delete(id); renderDrawer(); return;
  }
  if (t.id === 'selAll') { INSIGHTS[state.insight].cases.forEach(c => state.selected.add(c)); renderDrawer(); return; }
  if (t.id === 'selNone') { state.selected.clear(); renderDrawer(); return; }
  const row = t.closest('[data-row]'); if (row && t.tagName !== 'INPUT') { state.openRow = state.openRow === row.dataset.row ? null : row.dataset.row; renderDrawer(); return; }
  const act = t.closest('[data-action]');
  if (act) {
    if (!state.selected.size) { toast('Select at least one case first.'); return; }
    ({ alert: actionAlert, proactive: actionProactive, route: actionRoute, brief: actionBrief })[act.dataset.action]();
    return;
  }
  const fb = t.closest('[data-fb]');
  if (fb) { state.feedback[state.insight] = fb.dataset.fb; renderDrawer(); toast('Thanks. Feedback helps tune future insights.'); const id = state.insight; render(); openInsight(id); return; }
  if (t.closest('[data-dismiss]')) {
    const id = state.insight; state.dismissed.add(id); closeDrawer(); render();
    toast('Insight dismissed.', () => { state.dismissed.delete(id); render(); });
    return;
  }
  if (t.closest('[data-close]') || t.id === 'modal') { closeModal(); return; }
});

document.addEventListener('change', e => {
  if (e.target.id === 'range') { state.range = Number(e.target.value); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#modal').classList.contains('open')) closeModal(); else if (state.insight) closeDrawer();
});

renderNav();
render();
</script>
</body>
</html>
